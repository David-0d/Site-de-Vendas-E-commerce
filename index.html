<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aura Store | Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">AURA.</div>
        <div class="cart-badge">Carrinho: <span id="cart-count">0</span></div>
    </header>

    <main class="store-container">
        <div class="glass-product-card">
            <div class="product-image-placeholder">🎧</div>
            <h3>Wireless Master Headset</h3>
            <p class="product-desc">Som espacial com cancelamento ativo de ruído.</p>
            <span class="price">R$ 899,00</span>
            <button class="btn-glow" onclick="adicionarAoCarrinho()">Adicionar à Sacola</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
